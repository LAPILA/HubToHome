  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);

.btn {

  display: inline-flex;

  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;

.btn:is(.btn-block, .viz-tile) {

.btn:not(:disabled):hover {

.form-select:focus-visible {

  gap: 6px;

.form-check-input {

  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);

.form-switch .form-check-input:disabled + .form-check-label {

.form-check-label {

  cursor: var(--cursor-interaction, default);

.form-switch .form-check-input {

  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);

  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);

  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      &lt;/div&gt;

      &lt;section class=&quot;scenario&quot; aria-labelledby=&quot;scenario-title&quot;&gt;
        &lt;h2 id=&quot;scenario-title&quot;&gt;예시: QTE 전투에서 슈팅 전투로 바뀌는 순간&lt;/h2&gt;
        &lt;div class=&quot;sequence&quot; aria-label=&quot;전투 모듈 전환 시나리오 흐름&quot;&gt;
          &lt;div class=&quot;sequence-step event&quot;&gt;&lt;strong&gt;WHEN&lt;/strong&gt;적 HP 50% 아래 + 현재 스킬 종료&lt;/div&gt;
          &lt;div class=&quot;sequence-step action&quot;&gt;&lt;strong&gt;RULE → SEQUENCE&lt;/strong&gt;phase2 규칙이 시퀀스 트리거&lt;/div&gt;
          &lt;div class=&quot;sequence-step action&quot;&gt;&lt;strong&gt;DIRECTOR&lt;/strong&gt;BGM · 대사 · 페이드 순차 실행&lt;/div&gt;
          &lt;div class=&quot;sequence-step module&quot;&gt;&lt;strong&gt;MODULE SWITCH&lt;/strong&gt;turn_qte Exit → aim_shooter Enter&lt;/div&gt;
          &lt;div class=&quot;sequence-step action&quot;&gt;&lt;strong&gt;PRESENTATION&lt;/strong&gt;배경 · UI · 위치 · 애니메이션 전환&lt;/div&gt;
          &lt;div class=&quot;sequence-step module&quot;&gt;&lt;strong&gt;MODULE START&lt;/strong&gt;aim_shooter가 입력과 전투 규칙 소유&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;scenario-note&quot;&gt;중간의 대사는 플레이어가 넘길 때까지 Action Director가 기다린다. BGM/페이드/이동은 병렬 그룹으로 묶을 수도 있고, 전투 HP와 플래그는 Battle Session State에 계속 남는다.&lt;/p&gt;
      &lt;/section&gt;

      &lt;p class=&quot;status&quot;&gt;&lt;strong&gt;핵심 원칙:&lt;/strong&gt; 새로운 게임 규칙은 가능한 한 `BattleManager`의 조건문으로 늘리지 않는다. “언제(When)”는 Scenario Rule, “무엇을(Do)”는 Action Sequence, “어떻게(How)”는 Adapter / Module / Presentation Service에 둔다.&lt;/p&gt;
    &lt;/section&gt;

    &lt;aside class=&quot;side&quot; aria-label=&quot;선택한 레이어의 상세 설명&quot;&gt;
      &lt;h2&gt;레이어 상세&lt;/h2&gt;
      &lt;div class=&quot;detail&quot; id=&quot;architecture-detail&quot; aria-live=&quot;polite&quot;&gt;
        &lt;p class=&quot;detail-type&quot;&gt;SELECT A LAYER&lt;/p&gt;
        &lt;h3&gt;중앙 실행 축부터 보면 됨&lt;/h3&gt;
        &lt;p&gt;카드를 클릭하면 해당 레이어의 책임, 실제 코드 축, 다른 시스템과의 연결을 보여준다.&lt;/p&gt;
        &lt;ul&gt;&lt;li&gt;&lt;code&gt;Action Director&lt;/code&gt;가 공통 실행자&lt;/li&gt;&lt;li&gt;&lt;code&gt;Game Module&lt;/code&gt;은 바꿔 끼우는 게임 규칙&lt;/li&gt;&lt;li&gt;&lt;code&gt;Presentation Service&lt;/code&gt;는 어느 곳에서나 호출&lt;/li&gt;&lt;/ul&gt;
      &lt;/div&gt;
    &lt;/aside&gt;
  &lt;/main&gt;

  &lt;script&gt;
    (function () {
      const root = document.getElementById(&#x27;hubtohome-architecture-map&#x27;);
      const detail = root.querySelector(&#x27;#architecture-detail&#x27;);
      const nodes = root.querySelectorAll(&#x27;.architecture-node&#x27;);
      const entries = {
        source: { type: &#x27;AUTHORING TRUTH&#x27;, title: &#x27;Scenario Source YAML&#x27;, text: &#x27;전투·오버월드·연출의 흐름을 사람이 읽고 AI가 수정하기 쉬운 원본 데이터로 관리한다. 런타임 ScriptableObject는 이 원본을 실행 가능한 형태로 옮긴 결과다.&#x27;, facts: [&#x27;규칙의 When과 실행할 Sequence ID를 기록&#x27;, &#x27;액션 ID와 파라미터를 명시&#x27;, &#x27;Unity GUID/managed-reference 노이즈를 직접 편집할 필요 없음&#x27;] },
        runtimeAsset: { type: &#x27;UNITY RUNTIME DATA&#x27;, title: &#x27;Scenario Runtime Asset&#x27;, text: &#x27;YAML을 검증해 BattleScenarioData와 ActionSequenceAsset으로 동기화한다. 런타임은 이 에셋을 읽는다.&#x27;, facts: [&#x27;안전 반영은 임시 import → 전체 검증 → 기존 에셋 갱신 순서&#x27;, &#x27;동일 SequenceId는 기존 sub-asset을 재사용&#x27;, &#x27;원본에서 사라진 sequence는 자동 삭제하지 않음&#x27;] },
        editor: { type: &#x27;HUMAN EDITOR&#x27;, title: &#x27;시퀀스 메이커&#x27;, text: &#x27;사람이 YAML 원문 대신 시나리오 구조를 보고 액션 순서와 값만 가볍게 다루는 UI Toolkit 편집기다.&#x27;, facts: [&#x27;좌측: 규칙과 sequence / 중앙: timeline / 우측: action inspector&#x27;, &#x27;카탈로그에서 액션 선택, 삽입·복제·이동·비활성화&#x27;, &#x27;저장 및 반영: YAML 저장 + metadata sync + runtime asset reimport&#x27;] },
        rules: { type: &#x27;WHEN&#x27;, title: &#x27;Battle Scenario Runtime + Rule&#x27;, text: &#x27;전투에서 일어난 사실을 규칙과 비교해, 지금 실행할지 혹은 현재 스킬/모듈이 끝난 뒤 실행할지를 결정한다.&#x27;, facts: [&#x27;HP 임계점, 스킬 종료, 모듈 완료, 전투 시작/종료 이벤트&#x27;, &#x27;Once 정책: PerBattle / PerEncounterMemory&#x27;, &#x27;BattleScenarioEventRouter가 지연 타이밍을 보존&#x27;] },
        director: { type: &#x27;GLOBAL EXECUTION&#x27;, title: &#x27;Action Director&#x27;, text: &#x27;Action Sequence의 전역 실행자. 순차 실행이 기본이고 flow.parallel 하위 액션은 동시에 끝날 때까지 기다린다. 실패/취소도 한 Handle로 전파한다.&#x27;, facts: [&#x27;Overworld와 Battle 어느 쪽에서도 동일한 실행 모델&#x27;, &#x27;대사처럼 완료를 기다려야 하는 연출을 자연스럽게 멈춤&#x27;, &#x27;Unknown Action ID는 조용히 넘기지 않고 시퀀스를 실패 처리&#x27;] },
        registry: { type: &#x27;HOW&#x27;, title: &#x27;Action Adapter Registry&#x27;, text: &#x27;데이터의 action ID를 실제 C# 실행 코드에 연결한다. 시나리오가 구체 매니저를 직접 알지 않도록 막는 경계다.&#x27;, facts: [&#x27;flow.wait / dialogue.wait / bgm.crossfade / screen.fade&#x27;, &#x27;module.switch / module.start / battle.skill.timeline&#x27;, &#x27;액션 추가 시 Catalog·검증·한국어 이름·Adapter를 함께 추가&#x27;] },
        overworld: { type: &#x27;PRIMARY MODE&#x27;, title: &#x27;Overworld&#x27;, text: &#x27;플레이어가 돌아다니고 상호작용하는 최상위 공간이다. 미니게임이나 연출은 필요할 때 Action Sequence로 호출할 수 있다.&#x27;, facts: [&#x27;IInteractable / AreaTrigger / NPC / Room transition이 이벤트 출발점&#x27;, &#x27;BattleEncounterService로 전투 진입을 한 곳에 모음&#x27;, &#x27;현재 전투 모듈 전환은 Battle이 주 대상, Overworld 모듈은 같은 모델로 확장 가능&#x27;] },
        battle: { type: &#x27;PRIMARY MODE&#x27;, title: &#x27;Battle&#x27;, text: &#x27;전투라는 최상위 공간 안에서만 QTE, 슈팅, 권투 같은 Game Module이 교체된다. Battle 자체와 Game Module을 같은 것으로 취급하지 않는다.&#x27;, facts: [&#x27;Execution Gate가 트리거 시퀀스 실행 중 전투 흐름을 멈춤&#x27;, &#x27;Battle Session State가 모듈을 넘어 상태 유지&#x27;, &#x27;전투 끝난 결과와 Encounter Memory만 저장 범위&#x27;] },
        presentation: { type: &#x27;GLOBAL PRESENTATION&#x27;, title: &#x27;Presentation Service&#x27;, text: &#x27;대사·음악·화면·카메라·컷신·UI·VFX는 특정 전투 모듈의 부속물이 아니다. ActionExecutionContext의 좁은 service seam으로 호출한다.&#x27;, facts: [&#x27;DialogueManagerRunner: 클릭 완료까지 대기&#x27;, &#x27;AudioManagerActionRunner / ScreenTransitionRunner&#x27;, &#x27;Timeline은 고정 연출, 분기·저장·상태 정책은 Sequence가 소유&#x27;] },
        modules: { type: &#x27;GAMEPLAY REPLACEMENT&#x27;, title: &#x27;Game Module Runner&#x27;, text: &#x27;module.switch와 module.start가 GameModuleRegistry에서 ID로 모듈을 찾아 교체한다. 모듈은 UI·입력·규칙을 묶되 전체 전투 흐름을 독점하지 않는다.&#x27;, facts: [&#x27;IGameModuleRuntime: Enter / Exit / Start&#x27;, &#x27;GameModuleRuntimeContext로 세션 읽기, 명령 요청, 결과 발행&#x27;, &#x27;완료 결과는 GameModuleCompleted 이벤트가 되어 다시 규칙 평가로 돌아감&#x27;] },
        legacy: { type: &#x27;ADAPTER BOUNDARY&#x27;, title: &#x27;기존 게임 시스템&#x27;, text: &#x27;기존 코드를 버리지 않고, 새 레이어에서 부를 수 있게 어댑터로 감싼다. 그래서 QTE 전투와 SkillData가 지금도 정상 동작하면서 확장 구조에 포함된다.&#x27;, facts: [&#x27;BattleSkillTimelineRunner → SkillData.ActionTimeline&#x27;, &#x27;BattleTurnQteGameModuleRuntime → 기존 BattleManager의 QTE controller&#x27;, &#x27;BattleUIController / DialogueManager / AudioManager는 기존 소유권 유지&#x27;] },
        session: { type: &#x27;BATTLE-SCOPED TRUTH&#x27;, title: &#x27;Battle Session State&#x27;, text: &#x27;전투가 끝날 때까지 유지되어야 하는 공통 사실. 개별 모듈의 private bool이 아니라 다른 모듈과 Sequence가 같이 볼 수 있는 상태다.&#x27;, facts: [&#x27;현재 모듈, opening module, 참가자 HP/MP snapshot&#x27;, &#x27;battle.flag.set / clear로 전투 플래그 관리&#x27;, &#x27;HP/MP 변경은 IBattleParticipantCommandRunner 경유&#x27;] },
        memory: { type: &#x27;OUTSIDE-BATTLE SAVE&#x27;, title: &#x27;Encounter Memory&#x27;, text: &#x27;저장/로드는 전투 바깥 기준이다. 첫 만남인지, 어떤 비트를 봤는지, 승리했는지는 저장하지만 진행 중인 전투 상태는 복구하지 않는다.&#x27;, facts: [&#x27;SaveData.EncounterMemory에 저장&#x27;, &#x27;GlobalDataManager API로 읽고 쓰기&#x27;, &#x27;BattleEncounterMemoryRecorder가 전투 시작/결과와 연결&#x27;] },
        modulesNow: { type: &#x27;CURRENT IMPLEMENTATION&#x27;, title: &#x27;현재 Game Module 상태&#x27;, text: &#x27;turn_qte는 기존 전투를 새 모듈 경계 안으로 옮긴 호환 구현. aim_shooter는 모듈 전환과 피해/결과 흐름을 검증한 첫 비-QTE shell이다.&#x27;, facts: [&#x27;turn_qte: 기존 QTE turn/action/defense 흐름 재사용&#x27;, &#x27;aim_shooter: 입력·발사체·VFX·전용 UI는 아직 확장 대상&#x27;, &#x27;다음 boxing/minigame도 같은 Registry/Context 계약으로 추가&#x27;] }
      };
      function show(entry) {
        detail.innerHTML = &#x27;&lt;p class=&quot;detail-type&quot;&gt;&#x27; + entry.type + &#x27;&lt;/p&gt;&lt;h3&gt;&#x27; + entry.title + &#x27;&lt;/h3&gt;&lt;p&gt;&#x27; + entry.text + &#x27;&lt;/p&gt;&lt;ul&gt;&#x27; + entry.facts.map(function (fact) { return &#x27;&lt;li&gt;&#x27; + fact + &#x27;&lt;/li&gt;&#x27;; }).join(&#x27;&#x27;) + &#x27;&lt;/ul&gt;&#x27;;
      }
      nodes.forEach(function (node) {
        node.addEventListener(&#x27;click&#x27;, function () {
          nodes.forEach(function (item) { item.classList.remove(&#x27;active&#x27;); });
          node.classList.add(&#x27;active&#x27;);
          show(entries[node.dataset.key]);
        });
      });
    }());
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
