libraryId: overworld_party
name: "필드 동료"
description: "기록 경로를 따르는 필드 동료의 이동 상태와 표시를 연출합니다. 실제 전투 파티나 저장 편성을 바꾸지 않습니다."
category: overworld_party
order: 85
accent: "#76B899"
actions:
  overworld.party.mode:
    name: "동료 추종 상태"
    description: "동료를 경로 추종, 제자리 대기, 자동 추종 제외 상태로 전환합니다. 표시 여부는 별도입니다."
    usage: "slot 1은 첫 동료, 0은 전체입니다. 경로 밖이거나 기록이 만료되면 Follow만으로 직선 복귀하지 않습니다."
    summary: "동료 {slot} · {mode}"
    runtimeAdapter: OverworldPartyModeActionAdapter
    tags: [overworld, party, follow, hold]
    aliases: [동료, 추종, 대기, 이탈]
    contexts: [overworld_party_runner]
    modes: [overworld]
    preview: live_only
    preparation: unsupported
    icon: users
    example: "- overworld.party.mode: { slot: 1, mode: hold }"
    parameters:
      slot:
        name: "동료 번호"
        description: "1=첫 동료, 최대5. 0=현재 표시 대상 동료 전체. 없는 개별 동료는 실패합니다."
        type: integer
        control: number
        required: true
        quick: true
        default: "1"
        min: 0
        max: 5
        sources: [literal, input, event, context]
      mode:
        name: "추종 상태"
        description: "follow=보관 경로 추종, hold=현재 위치·커서 보관, detach=자동 추종 제외. 실제 탈퇴가 아닙니다."
        type: enum
        control: segmented
        required: true
        quick: true
        default: "hold"
        options: [follow, hold, detach]
        sources: [literal, input, event, context]
  overworld.party.visibility:
    name: "동료 표시"
    description: "추종 상태와 독립적으로 동료 외형을 보이거나 숨깁니다. 숨겨도 이동 상태는 유지합니다."
    usage: "연출에서만 사용합니다. 실제 파티 탈퇴·영입·저장 상태를 변경하지 않습니다. 방 도착 시 기본 표시로 초기화됩니다."
    summary: "동료 {slot} · 표시 {visible}"
    runtimeAdapter: OverworldPartyVisibilityActionAdapter
    tags: [overworld, party, visibility]
    aliases: [동료, 숨김, 표시]
    contexts: [overworld_party_runner]
    modes: [overworld]
    preview: live_only
    preparation: unsupported
    icon: eye
    example: "- overworld.party.visibility: { slot: 0, visible: false }"
    parameters:
      slot:
        name: "동료 번호"
        description: "1=첫 동료, 최대5. 0=전체. 없는 개별 동료는 실패합니다."
        type: integer
        control: number
        required: true
        quick: true
        default: "0"
        min: 0
        max: 5
        sources: [literal, input, event, context]
      visible:
        name: "표시 여부"
        description: "true는 표시, false는 숨김입니다. Follow/Hold/Detached 상태는 변경하지 않습니다."
        type: boolean
        control: toggle
        required: true
        quick: true
        default: "true"
        sources: [literal, input, event, context]
  overworld.party.move:
    name: "동료 개별 이동"
    description: "동료 한 명을 명시한 월드 XY 경유점과 최종 목표로 이동시키고 완료까지 기다립니다. 자동 길찾기가 아닙니다."
    usage: "통로는 연출자가 책임집니다. 완료 기본 상태는 Hold입니다. rejoin은 실제 보관 경로 위에 도착한 경우에만 Follow로 복귀합니다."
    summary: "동료 {slot} → ({x}, {y}) · {duration}초"
    runtimeAdapter: OverworldPartyMoveActionAdapter
    tags: [overworld, party, move, path]
    aliases: [동료, 이동, 경유점, 재합류]
    contexts: [overworld_party_runner]
    modes: [overworld]
    preview: live_only
    preparation: unsupported
    icon: route
    example: "- overworld.party.move:\n    slot: 1\n    x: 4\n    y: 2\n    duration: 1.2\n    path: [{\"x\": 2, \"y\": 1}, {\"x\": 4, \"y\": 1}]\n    rejoin: false"
    parameters:
      slot:
        name: "동료 번호"
        description: "1=첫 동료, 최대5. 0(전체)은 개별 이동에 사용할 수 없습니다."
        type: integer
        control: number
        required: true
        quick: true
        default: "1"
        min: 1
        max: 5
        sources: [literal, input, event, context]
      x:
        name: "목표 X"
        description: "최종 목표의 유한한 월드 X 좌표입니다. Z는 동료의 기존 값을 보존합니다."
        type: number
        control: number
        required: true
        quick: true
        default: "0"
        sources: [literal, input, event, context]
      y:
        name: "목표 Y"
        description: "최종 목표의 유한한 월드 Y 좌표입니다."
        type: number
        control: number
        required: true
        quick: true
        default: "0"
        sources: [literal, input, event, context]
      duration:
        name: "이동 시간"
        description: "모든 경유점과 최종 목표까지의 전체 시간입니다. 0은 즉시 배치입니다."
        type: duration
        control: number
        required: true
        default: "1"
        min: 0
        unit: "초"
        sources: [literal, input, event, context]
      path:
        name: "중간 경유점"
        description: "선택적 {x,y} 배열, 최대128개. YAML에서는 JSON 배열로 좌표 키에 큰따옴표를 씁니다. 최종 x/y 목표는 자동으로 마지막에 추가됩니다."
        type: json
        control: json
        default: "[]"
        sources: [literal, input, event, context]
      rejoin:
        name: "도착 후 추종 복귀"
        description: "기본 false(Hold). true는 도착 위치가 실제 보관 경로 위임이 검증될 때만 Follow입니다. 검증 실패는 Hold와 Action 실패를 남깁니다."
        type: boolean
        control: toggle
        default: "false"
        sources: [literal, input, event, context]
  overworld.party.gather:
    name: "동료 재집결"
    description: "모든 동료를 리더 위치에 즉시 모으고 경로를 초기화합니다. 가상의 뒤쪽 경로는 만들지 않습니다."
    usage: "명시적 암전·맵 도착 재배치용입니다. 일반 Follow/재합류나 경로 기록 만료를 숨기는 용도로 사용하지 않습니다."
    summary: "리더 위치에 동료 재집결"
    runtimeAdapter: OverworldPartyGatherActionAdapter
    tags: [overworld, party, gather, teleport]
    aliases: [동료, 집결, 재배치]
    contexts: [overworld_party_runner]
    modes: [overworld]
    preview: live_only
    preparation: unsupported
    icon: locate
    example: "- screen.fade: { mode: out, duration: 0.25 }\n- overworld.party.gather: {}\n- screen.fade: { mode: in, duration: 0.25 }"
